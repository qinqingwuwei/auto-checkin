[project]
name = "checkin"
version = "0.1.0"
description = "Trae CN + WorkBuddy 自动签到、积分明细与到期预警（个人自用）"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "playwright>=1.47",
]

[project.scripts]
checkin = "checkin.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/checkin"]